      items:
        - uuid: 9047b22a5af249a7917d6f96b677b456
          name: 'Combustible: Capacidad Restante (Litros)'
          type: CALCULATED
          key: comap.custom.fuel.capacityRemaining
          units: L
          params: 'last(//comap.custom.fuel.totalCapacity) * (last(//comap.groupRdCfg.vNivelCombustible) / 100)'
        - uuid: 4a004f2a15c7426c8f60a736306a8512
          name: 'Combustible: Capacidad Total (Litros)'
          type: CALCULATED
          key: comap.custom.fuel.totalCapacity
          delay: '86400'
          params: '{$FUEL_TOTAL_CAPACITY}'
        - uuid: 2fb80b464bf44759a0b32c5e8ecb4b68
          name: 'Combustible: Autonomia restante (Horas)'
          type: CALCULATED
          key: comap.custom.remainingAutonomy
          units: h
          params: 'last(//comap.custom.fuel.totalCapacity) / last(//comap.groupRdCfg.vFuelRate)'
        - uuid: cf7521f3ff684ed2a9995b58b811f986
          name: 'Motor: Carga (%)'
          type: DEPENDENT
          key: comap.groupRdCfg.vCarga
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].engineLoad'
            - type: JAVASCRIPT
              parameters:
                - 'var v = parseInt(value, 10);if (v === -32768 || v === -2147483648) { throw ''N/A''; }return value;'
          master_item:
            key: comap.walk.groupRdCfg
